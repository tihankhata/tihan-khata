/* Tihan Khata - ইউটিউব ও টিভি অ্যাড-অন. মূল <script> এর পরে লোড হবে */

async function vxLoad(){

function vxEmb(u){
  u=String(u||'').trim();
  const m=u.match(/(?:youtu\.be\/|[?&]v=|\/live\/|\/embed\/|\/shorts\/)([\w-]{11})/);
  if(m)return{t:'f',s:'https://www.youtube.com/embed/'+m[1]+'?autoplay=1&playsinline=1&rel=0'};
  if(/\.(mp4|webm|m3u8)(\?|#|$)/i.test(u))return{t:'v',s:u};
  return{t:'f',s:u};
}

  const e=vxEmb(u);

  }</div><div style="padding:8px 4px 2px"><b>${esc(title)}</b></div></div>`;
}
function vxHls(){
  const v=document.getElementById('vxv');

  v.dataset.done=1;
  const s=v.dataset.src;
  if(/\.m3u8/i.test(s)&&!v.canPlayType('application/vnd.apple.mpegurl')){

async function sha(s){
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('tk:'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  catch(e){let h=0;for(const c of 'tk:'+s)h=(h*31+c.charCodeAt(0))|0;return'x'+h}
}

function vxSend(priv){
  const cs=allC();
  modal(priv?'ব্যক্তিগত বার্তা/ভিডিও':'ভিডিও পাঠান',[
    ...(priv?[]:[{k:'biz',l:'ব্যবসা (কাস্টমার না বাছলে এই ব্যবসার সবাই পাবে)',o:[['all','সব ব্যবসা'],...db.biz.map(b=>[b.id,b.name])]}]),
    {k:'to',l:priv?'কাকে (এক বা একাধিক)':'নির্দিষ্ট কাস্টমার (ঐচ্ছিক, এক বা একাধিক)',c:cs.map(c=>[c.id,c.name]),v:[]},
    {k:'title',l:'শিরোনাম'},
    ...(priv?[{k:'body',l:'বার্তা',t:'area'}]:[]),
    {k:'url',l:priv?'ইউটিউব লিংক (ঐচ্ছিক)':'ইউটিউব লিংক',t:'url'}],
  async r=>{
    const title=r.title.trim(),url=(r.url||'').trim(),body=(r.body||'').trim();
    if(!title||(priv?(!url&&!body):!url)){toast('সব ঘর পূরণ করুন');return false}
    let rows=[];
    if(r.to.length){
      r.to.forEach(cid=>{
        const bs=U(cid).biz||[],bz=bs.includes(r.biz)?r.biz:bs[0];
        if(bz)rows.push({business_id:bz,to_user:cid});
      });
    }else if(!priv){
      (r.biz=='all'?db.biz.map(b=>b.id):[r.biz]).forEach(bz=>rows.push({business_id:bz,to_user:null}));
    }else{toast('কাস্টমার বাছুন');return false}
    if(!rows.length){toast('কোনো প্রাপক পাওয়া যায়নি');return false}
    rows=rows.map(x=>({id:uid(),...x,title,url:url||null,body:body||null,private:!!priv}));
    const{error}=await sb.from('videos').insert(rows);
    if(error){alert(error.message);return false}
    toast('পাঠানো হয়েছে ('+bn(rows.length)+')');vxLoad();
  });
}

function adImg(f){
  return new Promise((ok,no)=>{
    const r=new FileReader();
    r.onload=()=>{const im=new Image();
      im.onload=()=>{const M=640,k=Math.min(1,M/Math.max(im.width,im.height)),c=document.createElement('canvas');
        c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.75))};
      im.onerror=()=>no(new Error('image'));im.src=r.result};
    r.onerror=()=>no(new Error('read'));r.readAsDataURL(f);
  });
}

photo=function(inp){
  const f=inp.files[0];if(!f)return;
  if(!navigator.onLine){toast('\u0987\u09a8\u09cd\u099f\u09be\u09b0\u09a8\u09c7\u099f \u09b2\u09be\u0997\u09ac\u09c7');return}
  const r=new FileReader();
  r.onload=()=>{const im=new Image();
    im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=160;
      const x=c.getContext('2d'),s=Math.min(im.width,im.height);
      x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,160,160);
      const ph=c.toDataURL('image/jpeg',.75);
      sb.from('profiles').update({photo:ph}).eq('id',me.id).then(res=>{
        if(res.error){toast(res.error.message);return}
        me.photo=ph;const u=db.users.find(z=>z.id==me.id);if(u)u.photo=ph;
        persist();render();toast('\u09b8\u0982\u09b0\u0995\u09cd\u09b7\u09bf\u09a4 \u09b9\u09af\u09bc\u09c7\u099b\u09c7');
      });
    };
    im.src=r.result};
  r.readAsDataURL(f);
};

async function plImport(inp){

      const wb=XLSX.read(await f.arrayBuffer());rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''}).map(r=>r.map(c=>String(c).trim()));

function pkPackAdd(id){const p=X3.packs.find(x=>x.id==id);if(!p)return;const k='pk_'+id,x=PK.items.find(i=>i.id==k);if(x)x.qty+=1;else PK.items.push({id:k,pack:true,name:(p.kind=='bag'?'ব্যাগ ':'জার ')+p.name,price:Number(p.price),unit:'পিস',qty:1});
const q=PK.items.find(i=>i.id==k).qty;if(p.stock!=null&&q>Number(p.stock))toast('⚠️ স্টকে মাত্র '+bn(Number(p.stock))+'টি আছে');pkDraw()}
const _custH4Q=custH;custH=function(){return _custH4Q().replace('<div id="pkl"></div></div>','<div id="pkl"></div><div id="pkx"><div class="row" style="gap:6px;margin-top:8px;align-items:center"><span class="m">💸 অতিরিক্ত ডিসকাউন্ট</span><input id="mdv" type="number" step="any" placeholder="0" style="width:80px;margin:0" oninput="mdSet()"><select id="mdm" onchange="mdSet()" style="margin:0"><option value="percent">%</option><option value="amount">৳</option></select></div><div class="row" style="gap:6px;margin-top:8px"><button type="button" class="s" onclick="pkPack(\'bag\')">🛍️ ব্যাগ</button><button type="button" class="s" onclick="pkPack(\'jar\')">🫙 জার</button></div><div id="pkpk"></div></div></div>')};
let PQ4=[];try{PQ4=JSON.parse(localStorage.getItem('tihan_packq')||'[]')}catch(e){}
function pq4Save(){try{localStorage.setItem('tihan_packq',JSON.stringify(PQ4))}catch(e){}}
async function pq4Flush(){if(!sb||!me||!navigator.onLine||!PQ4.length)return;const q=PQ4.slice();PQ4=[];pq4Save();for(const j of q){try{const x=await sb.rpc('pack_use',{pid:j.id,q:j.q});if(x.error)throw x.error}catch(e){PQ4.push(j)}}pq4Save();await x4Load()}
window.addEventListener('online',()=>pq4Flush());
const _saveTx4Q=saveTx;saveTx=function(){const n=PK.items.length,used=PK.items.filter(i=>i.pack&&i.qty>0).map(i=>({id:i.id.slice(3),q:i.qty}));_saveTx4Q();
if(n&&!PK.items.length){PK.md=null;used.forEach(u=>{const p=X3.packs.find(x=>x.id==u.id);if(p&&p.stock!=null){p.stock=Math.max(0,Number(p.stock)-u.q);PQ4.push(u)}});if(used.length){pq4Save();try{localStorage.setItem('tihan_x4',JSON.stringify({r:X3.rules,k:X3.packs}))}catch(e){}pq4Flush();if(page=='bj')render()}}else if(n)PK.md=null};
/* rules page */
P.dv=()=>{const rs=X3.rules.filter(r=>myBiz().includes(r.business_id));
const card=r=>{const p=X3.prod.find(x=>x.id==r.product_id);return '<div class="c"><div class="row sp"><b>'+KICON[r.kind]+' '+KIND[r.kind]+' '+rVal(r)+'</b><span class="tag">'+(r.active===false?'বন্ধ':'চালু')+'</span></div><div class="m">'+(p?esc(p.name):'সব পণ্য')+(Number(r.min_qty)>0?' · কমপক্ষে '+bn(Number(r.min_qty))+(p?' '+esc(p.unit||''):''):'')+(myBiz().length>1?' · '+esc(B(r.business_id).name):'')+'</div><div class="row" style="margin-top:6px;gap:6px"><button class="s g" onclick="dvToggle(\''+r.id+'\')">'+(r.active===false?'▶ চালু করুন':'⏸ বন্ধ করুন')+'</button><button class="s g" onclick="dvForm(\''+r.id+'\')">✏️</button><button class="s r" onclick="dvDel(\''+r.id+'\')">🗑️</button></div></div>'};
return '<button onclick="dvForm()">➕ নতুন নিয়ম</button><div class="m" style="margin:8px 2px">এখানে যোগ করা নিয়ম ওই পণ্য নেওয়া সব কাস্টমারের বিলে নিজে থেকে যোগ হবে। ব্যাগ ও জারে কোনো ডিসকাউন্ট, ভ্যাট বা চার্জ লাগে না।</div>'
+['discount','vat','service'].map(k=>{const l=rs.filter(r=>r.kind==k);return '<div class="m" style="margin:10px 2px 4px"><b>'+KICON[k]+' '+KIND[k]+'</b> ('+bn(l.length)+')</div>'+(l.map(card).join('')||'<div class="m" style="margin:0 2px 6px">কোনো নিয়ম নেই</div>')}).join('')
+'<div class="m" style="margin:14px 2px 4px"><b>📦 সব পণ্য</b></div>'+(X3.prod.filter(p=>myBiz().includes(p.business_id)).map(p=>{const pr=rs.filter(r=>r.active!==false&&(!r.product_id||r.product_id==p.id));return '<div class="c"><div class="row sp"><b>'+esc(p.name)+'</b><button class="s" onclick="dvForm(null,\''+p.id+'\')">➕ নিয়ম</button></div><div class="m">'+pPrice(p)+'</div><div>'+(pr.map(r=>'<span class="tag">'+KICON[r.kind]+' '+rVal(r)+(Number(r.min_qty)>0?' ≥'+bn(Number(r.min_qty)):'')+'</span>').join(' ')||'<span class="m">কোনো নিয়ম নেই</span>')+'</div></div>'}).join('')||'<p class="m">কোনো পণ্য নেই</p>')};
function dvProds(b,sel){return opt4('','সব পণ্য',sel||'')+X3.prod.filter(p=>p.business_id==b).map(p=>opt4(p.id,esc(p.name),sel||'')).join('')}
function dvBizCh(){const e=$('#dvp');if(e)e.innerHTML=dvProds($('#dvb').value,'')}
function dvForm(id,pid){const r=X3.rules.find(x=>x.id==id)||{kind:'discount',mode:'percent',value:'',min_qty:0,product_id:pid||null,business_id:(pid&&(X3.prod.find(p=>p.id==pid)||{}).business_id)||dvBiz()};
ovOpen('<b>'+(id?'নিয়ম এডিট':'নতুন নিয়ম')+'</b>'+(myBiz().length>1?'<label>🏪 ব্যবসা</label><select id="dvb" onchange="dvBizCh()">'+myBiz().map(b=>opt4(b,esc(B(b).name),r.business_id)).join('')+'</select>':'<input id="dvb" type="hidden" value="'+r.business_id+'">')
+'<label>কাজ</label><select id="dvk">'+opt4('discount','🏷️ ডিসকাউন্ট',r.kind)+opt4('vat','🧾 ভ্যাট',r.kind)+opt4('service','🛎️ সার্ভিস চার্জ',r.kind)+'</select>'
+'<label>ধরন</label><select id="dvm">'+opt4('percent','% (শতাংশ)',r.mode)+opt4('amount','৳ (টাকার অংক)',r.mode)+'</select>'
+'<label>মান</label><input id="dvv" type="number" step="any" value="'+(r.value===''?'':Number(r.value))+'">'
+'<label>পণ্য</label><select id="dvp">'+dvProds(r.business_id,r.product_id)+'</select>'
+'<label>সর্বনিম্ন পরিমাণ (ঐচ্ছিক)</label><input id="dvq" type="number" step="any" value="'+(Number(r.min_qty)||'')+'" placeholder="যেমন ১০">'
+'<div class="m" style="font-size:12px;margin-top:4px">টাকার অংক: নির্দিষ্ট পণ্য হলে প্রতি ইউনিটে, "সব পণ্য" হলে পুরো বিলে একবার।</div><div class="row" style="gap:6px;margin-top:10px"><button onclick="dvSave(\''+(id||'')+'\')">💾 সংরক্ষণ</button><button class="g" onclick="ovClose()">বাতিল</button></div>')}
async function dvSave(id){const v=parseFloat(nd($('#dvv').value)),m=$('#dvm').value;if(!(v>=0)||$('#dvv').value===''){toast('মান দিন');return}if(m=='percent'&&v>100){toast('শতাংশ ১০০-এর বেশি হবে না');return}
const row={business_id:$('#dvb').value,product_id:$('#dvp').value||null,kind:$('#dvk').value,mode:m,value:v,min_qty:parseFloat(nd($('#dvq').value))||0,active:true};
const x=id?await sb.from('price_rules').update(row).eq('id',id):await sb.from('price_rules').insert(row);if(x.error){alert(x.error.message);return}ovClose();await x4Load();toast('সংরক্ষিত হয়েছে')}
async function dvToggle(id){const r=X3.rules.find(x=>x.id==id);if(!r)return;const x=await sb.from('price_rules').update({active:r.active===false}).eq('id',id);if(x.error){alert(x.error.message);return}await x4Load()}
async function dvDel(id){if(!confirm(tr('মুছে ফেলবেন?')))return;const x=await sb.from('price_rules').delete().eq('id',id);if(x.error){alert(x.error.message);return}await x4Load();render()}
/* bag & jar page */
P.bj=()=>{const mine=X3.packs.filter(p=>myBiz().includes(p.business_id)),ic=k=>k=='bag'?'🛍️ ব্যাগ':'🫙 জার';
const card=p=>'<div class="c"><div class="row sp"><b>'+ic(p.kind)+' — '+esc(p.name)+'</b><b>৳'+bn(Number(p.price))+'</b></div><div class="m">'+(p.stock==null?'স্টক: নির্ধারিত নেই':'স্টক: '+bn(Number(p.stock)))+(myBiz().length>1?' · '+esc(B(p.business_id).name):'')+'</div><div class="row" style="margin-top:6px;gap:6px"><button class="s g" onclick="bjForm(\''+p.id+'\')">✏️</button><button class="s r" onclick="bjDel(\''+p.id+'\')">🗑️</button></div></div>';
return '<div class="row" style="gap:6px"><button onclick="bjForm(null,\'bag\')">➕ ব্যাগ</button><button onclick="bjForm(null,\'jar\')">➕ জার</button></div><div class="m" style="margin:8px 2px">সাইজ ও দাম যোগ করুন। বিলে ব্যাগ/জার বেছে নিলে এগুলোতে ডিসকাউন্ট, ভ্যাট বা চার্জ হবে না। স্টক ঐচ্ছিক।</div>'
+['bag','jar'].map(k=>'<div class="m" style="margin:10px 2px 4px"><b>'+ic(k)+'</b></div>'+(mine.filter(p=>p.kind==k).map(card).join('')||'<div class="m" style="margin:0 2px">কিছু যোগ করা হয়নি</div>')).join('')};
function bjForm(id,kind){const p=X3.packs.find(x=>x.id==id)||{kind:kind||'bag',name:'',price:'',stock:null,business_id:dvBiz()};
ovOpen('<b>'+(id?'এডিট':'নতুন যোগ')+'</b>'+(myBiz().length>1?'<label>🏪 ব্যবসা</label><select id="bjb">'+myBiz().map(b=>opt4(b,esc(B(b).name),p.business_id)).join('')+'</select>':'<input id="bjb" type="hidden" value="'+p.business_id+'">')
+'<label>ধরন</label><select id="bjk">'+opt4('bag','🛍️ ব্যাগ',p.kind)+opt4('jar','🫙 জার',p.kind)+'</select><label>সাইজ / নাম</label><input id="bjn" value="'+esc(p.name)+'" placeholder="যেমন ৫ কেজি / ১ লিটার">'
+'<label>দাম (৳)</label><input id="bjp" type="number" step="any" value="'+(p.price===''?'':Number(p.price))+'"><label>স্টক (ঐচ্ছিক)</label><input id="bjs" type="number" step="any" value="'+(p.stock==null?'':Number(p.stock))+'" placeholder="খালি রাখলে স্টক ধরা হবে না">'
+'<div class="row" style="gap:6px;margin-top:10px"><button onclick="bjSave(\''+(id||'')+'\')">💾 সংরক্ষণ</button><button class="g" onclick="ovClose()">বাতিল</button></div>')}
async function bjSave(id){const n=$('#bjn').value.trim(),pr=parseFloat(nd($('#bjp').value)),s=$('#bjs').value.trim();if(!n||!(pr>=0)||$('#bjp').value===''){toast('সাইজ ও দাম দিন');return}
const row={business_id:$('#bjb').value,kind:$('#bjk').value,name:n,price:pr,stock:s===''?null:parseFloat(nd(s))};
const x=id?await sb.from('packs').update(row).eq('id',id):await sb.from('packs').insert(row);if(x.error){alert(x.error.message);return}ovClose();await x4Load();toast('সংরক্ষিত হয়েছে')}
async function bjDel(id){if(!confirm(tr('মুছে ফেলবেন?')))return;const x=await sb.from('packs').delete().eq('id',id);if(x.error){alert(x.error.message);return}await x4Load();render()}
/* tiles */
const _gridH4Q=gridH;gridH=function(){const h=_gridH4Q();return me&&me.role!='customer'?h.replace(/<\/div>$/,'<div class="gi" onclick="go(\'dv\')"><span class="gc c2">🏷️</span>ডিসকাউন্ট / ভ্যাট</div><div class="gi" onclick="go(\'bj\')"><span class="gc c3">🛍️</span>ব্যাগ ও জার</div></div>'):h};
/* bill with discount, VAT, service charge */
billPrint=function(){const its=PK.items.filter(i=>i.qty>0);if(!its.length){toast('কোনো পণ্য নেই');return}
const r=x=>Math.round(x*100)/100,bz=B(pkBiz()||cb),cu=U(cur),c=calcAll();let hot=bz.help||'';if(!hot){const a=db.users.find(u=>u.role=='admin'&&u.biz.includes(bz.id)&&u.phone);hot=a?a.phone:''}
if(!bz.address)toast('দোকানের ঠিকানা সেট করা নেই (ব্যবসা সম্পাদনায় দিন)');
const L=[{t:'c',s:bz.name||'',z:30,b:1}];if(bz.address)L.push({t:'c',s:bz.address,z:22});if(hot)L.push({t:'c',s:'Hotline: '+hot,z:22});
L.push({t:'hr'},{t:'l',s:'কাস্টমার: '+(cu.name||''),z:22},{t:'l',s:'ফোন: '+(cu.phone||''),z:22},{t:'l',s:new Date().toLocaleString('bn-BD'),z:20},{t:'hr'});
its.forEach((i,k)=>L.push({t:'row',l:bn(k+1)+'. '+i.name,r:'৳'+bn(r(i.qty*i.price)),z:24},{t:'l',s:'   '+bn(i.qty)+' '+i.unit+' × ৳'+bn(i.price),z:20}));
L.push({t:'hr'});const ex=(l,v)=>L.push({t:'row',l,r:v,z:22});
if(c.autoDisc||c.manual||c.vat||c.svc){ex('Subtotal','৳'+bn(r(c.sub+c.packs)));if(c.autoDisc)ex('Discount','-৳'+bn(c.autoDisc));if(c.manual)ex('Extra Discount','-৳'+bn(c.manual));if(c.vat)ex('VAT','+৳'+bn(c.vat));if(c.svc)ex('Service Charge','+৳'+bn(c.svc));L.push({t:'hr'})}
L.push({t:'row',l:'Total',r:'৳'+bn(c.total),z:28,b:1},{t:'c',s:enWords(c.total),z:20},{t:'hr'},{t:'c',s:'ধন্যবাদ',z:24},{t:'sp',h:10});tkPrint(L)};
try{if(me&&db){x4Load();render()}}catch(e){}
</script>
